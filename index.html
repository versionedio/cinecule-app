<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cinecule</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Lora:wght@400;600&display=swap" rel="stylesheet" />
    <script>
      (function () {
        var stored = localStorage.getItem("theme");
        var dark = stored ? stored === "dark" : true;
        if (dark) document.documentElement.classList.add("dark");
      })();
    </script>
    <style>
      html, body, #root { height: 100%; margin: 0; }
      html:not(.dark), html:not(.dark) body { background: #f3f2f2; }
      html.dark, html.dark body { background: #191816; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
