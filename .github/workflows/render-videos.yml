name: Render videos

# Renders queued videos (exportasset status "created", created when a project reaches "rendering").
#
# Triggers:
#  - workflow_dispatch: the platform calls this through its GitHub connector the moment a render is
#    queued, so rendering starts within about a minute and nothing polls in the meantime. It can also
#    be run by hand from the Actions tab (use the dev branch) if a render is ever left queued.
#
# The first step only needs Node, so the heavy install/build/render steps are skipped when nothing
# is queued. Dispatch only works from the default branch.
on:
  workflow_dispatch:

permissions:
  contents: read

# One render at a time: claiming an asset by status is only race-free because of this.
concurrency:
  group: render-videos
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      VITE_ORG_API_ENDPOINT: ${{ vars.VITE_ORG_API_ENDPOINT || secrets.VITE_ORG_API_ENDPOINT }}
      VITE_ORG_CODE: ${{ vars.VITE_ORG_CODE || secrets.VITE_ORG_CODE }}
      VITE_CLIENT_ID: ${{ vars.VITE_CLIENT_ID || secrets.VITE_CLIENT_ID }}
      VITE_API_KEY: ${{ secrets.VITE_API_KEY }}
      # A tenant user the render job signs in as (read access to the pipeline entities,
      # write access to exportasset, permission to run the render_complete logic block).
      NS_EMAIL: ${{ secrets.NS_EMAIL }}
      NS_PASSWORD: ${{ secrets.NS_PASSWORD }}
      # Optional: with either key, picture scenes get a generated picture instead of line icons
      # (Gemini is used first if both are set). Without a key (or if generation fails) the icons are used. See scripts/render/images.mjs.
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      ELEVENLABS_IMAGE_KEY: ${{ secrets.ELEVENLABS_IMAGE_KEY }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Claim a queued render
        id: claim
        run: node scripts/render/claim.mjs

      - name: Install dependencies
        if: steps.claim.outputs.has_work == 'true'
        run: npm ci

      - name: Install Chromium and ffmpeg
        if: steps.claim.outputs.has_work == 'true'
        run: |
          npx playwright install --with-deps chromium
          ffmpeg -version >/dev/null 2>&1 || sudo apt-get install -y ffmpeg
          ffmpeg -version | head -1

      - name: Build the app (the render page is part of it)
        if: steps.claim.outputs.has_work == 'true'
        run: npm run build

      - name: Render (and drain the queue)
        if: steps.claim.outputs.has_work == 'true'
        run: node scripts/render/worker.mjs "${{ steps.claim.outputs.asset_id }}"
